services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/safestay
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-600000}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:5000"
    # Scale to more replicas for high concurrency:
    #   docker compose up -d --scale app=3
    # (put a load balancer such as nginx/traefik in front for multi-replica setups)

volumes:
  mongo-data:
